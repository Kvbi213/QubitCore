[workspace]
resolver = "2"
members = [
    "crates/qubit-protocol",
    "crates/qubit-storage",
    "crates/qubit-mcp",
    "crates/qubit-sandbox",
    "crates/qubit-agents",
    "crates/qubit-core",
    "crates/qubit-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kvbi213 <lisjakub2106@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kvbi213/Qubit"

[workspace.dependencies]
qubit-protocol = { path = "crates/qubit-protocol" }
qubit-storage = { path = "crates/qubit-storage" }
qubit-mcp = { path = "crates/qubit-mcp" }
qubit-sandbox = { path = "crates/qubit-sandbox" }
qubit-agents = { path = "crates/qubit-agents" }
qubit-core = { path = "crates/qubit-core" }

# Async & Networking
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Serialization & Protocols
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = { version = "9.0", features = ["uuid-impl", "chrono-impl", "serde-json-impl"] }

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# CLI & Utilities
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.14"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
